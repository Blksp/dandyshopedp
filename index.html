        .stock-in{background:var(--lime); color:var(--ink)}
        .stock-low{background:var(--orange); color:white; animation:pulse 1.2s infinite alternate}
        .stock-out{background:var(--ink); color:var(--paper)}
        @keyframes pulse{from{transform:rotate(-1deg) scale(1)} to{transform:rotate(1deg) scale(1.05)}}
        .card-img{height:210px; background:var(--paper-2); border:2px solid var(--ink); display:grid; place-items:center; overflow:hidden; position:relative; cursor:pointer; min-width:0}
        .card-img img{width:100%; height:100%; object-fit:contain; padding:12px; mix-blend-mode:multiply; transition:.35s}
        .card:hover .card-img img{transform:scale(1.06) rotate(1deg)}
        .card-stamp{position:absolute; top:8px; left:8px; background:var(--orange); color:white; font-family:'Anton'; font-size:9px; letter-spacing:.12em; padding:3px 7px; transform:rotate(-7deg); border:1px solid var(--ink)}
        .card-discount{position:absolute; bottom:8px; right:8px; background:var(--ink); color:var(--lime); font-size:9px; padding:3px 6px; letter-spacing:.12em; border:1px solid var(--ink)}
        .card-body{flex:1; padding-top:12px; min-width:0}
        .card-title{font-family:'Anton'; font-size:21px; line-height:.95; letter-spacing:.01em; min-height:42px; word-break:break-word}
        .card-family{font-size:10px; margin-top:6px; line-height:1.35; opacity:.85; border-left:2px solid var(--orange); padding-left:8px}
        .card-notes{font-size:10px; margin-top:6px; opacity:.6; line-height:1.35; font-style:italic; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
        .card-prices{margin-top:12px; border:2px solid var(--ink); display:grid; grid-template-columns:1fr 1fr}
        .card-prices div{padding:8px 10px}
        .card-prices div:first-child{border-right:2px solid var(--ink); background:var(--paper-2)}
        .card-prices .label{font-size:7px; letter-spacing:.18em; display:block; margin-bottom:2px}
        .card-prices .value{font-family:'Anton'; font-size:15px}
        .card-prices .value.retail{text-decoration:line-through; opacity:.55}
        .card-prices .value.dandy{color:var(--orange); font-size:18px}
        .card-actions{margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:8px}
        .card-actions .btn{justify-content:center; padding:9px; font-size:11px}
        .how{background:var(--lime); border-bottom:var(--line) solid var(--ink); display:grid; grid-template-columns:1fr 1fr 1fr; gap:0; max-width:100vw}
        .how div{padding:22px 20px; border-right:var(--line) solid var(--ink)}
        .how div:last-child{border-right:0}
        .how h4{font-size:18px; margin-bottom:8px}
        .how p{font-size:11px; line-height:1.5}
        footer{background:var(--ink); color:var(--paper); padding:28px 22px; border-top:var(--line) solid var(--ink); max-width:100vw; overflow:hidden}
        .footer-grid{display:grid; grid-template-columns:1.2fr .7fr .7fr; gap:22px; max-width:100%}
        .footer-grid h4{font-family:'Anton'; font-size:16px; letter-spacing:.06em; margin-bottom:10px; color:var(--lime)}
        .footer-grid p, .footer-grid li{font-size:11px; line-height:1.6; opacity:.8}
        .footer-grid ul{list-style:none; padding:0; margin:0}
        .stencil{font-size:9px; letter-spacing:.22em; border:1px dashed var(--paper); padding:4px 8px; display:inline-block; opacity:.6}
        .modal{position:fixed; inset:0; background:rgba(10,10,10,.86); backdrop-filter:blur(5px); z-index:100; display:none; place-items:center; padding:18px}
        .modal.open{display:grid}
        .modal-box{background:var(--paper); border:4px solid var(--ink); max-width:560px; width:100%; box-shadow:12px 12px 0 var(--ink); position:relative; max-height:92vh; overflow:auto; max-width:calc(100vw - 36px)}
        .modal-head{padding:14px 16px; border-bottom:var(--line) solid var(--ink); display:flex; justify-content:space-between; align-items:center; background:var(--ink); color:var(--paper)}
        .modal-head strong{font-family:'Anton'; font-size:16px; letter-spacing:.06em}
        .modal-close{background:var(--paper); border:2px solid var(--ink); width:30px; height:30px; display:grid; place-items:center; cursor:pointer; font-weight:700}
        .modal-body{padding:16px}
        .modal-body img{width:100%; height:260px; object-fit:contain; background:var(--paper-2); border:var(--line) solid var(--ink)}
        .modal-meta{margin-top:12px; display:grid; gap:10px}
        .modal-prices{display:grid; grid-template-columns:1fr 1fr; border:var(--line) solid var(--ink); margin-top:10px}
        .modal-prices div{padding:10px 12px}
        .modal-prices div:first-child{border-right:var(--line) solid var(--ink); background:var(--paper-2)}
        /* ADMIN */
        .gear{position:fixed; bottom:16px; left:16px; z-index:70; width:52px; height:52px; background:var(--ink); color:var(--paper); border:3px solid var(--ink); border-radius:50%; display:grid; place-items:center; cursor:pointer; font-size:22px; box-shadow:4px 4px 0 var(--ink); transform:rotate(-6deg)}
        .gear:hover{transform:rotate(6deg) scale(1.05); background:var(--orange)}
        .admin-overlay{position:fixed; inset:0; z-index:200; background:var(--paper); display:flex; flex-direction:column; overflow:hidden; border:4px solid var(--ink)}
        .admin-header{background:var(--ink); color:var(--paper); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:var(--line) solid var(--ink); flex-wrap:wrap; gap:8px}
        .admin-header h2{font-size:22px; letter-spacing:.04em}
        .admin-tabs{display:flex; gap:0; background:var(--paper-2); border-bottom:var(--line) solid var(--ink); overflow-x:auto}
        .admin-tab{padding:12px 18px; border-right:var(--line) solid var(--ink); cursor:pointer; font-family:'Anton'; font-size:12px; letter-spacing:.08em; white-space:nowrap}
        .admin-tab.active{background:var(--lime); transform:rotate(-1deg)}
        .admin-tab:hover{background:var(--orange); color:white}
        .admin-content{flex:1; overflow:auto; padding:18px; background:repeating-linear-gradient(45deg, var(--paper) 0 12px, var(--paper-2) 12px 24px)}
        .admin-card{background:var(--paper); border:var(--line) solid var(--ink); padding:14px; margin-bottom:14px; box-shadow:6px 6px 0 var(--ink); position:relative}
        .admin-card::before{content:""; position:absolute; top:-8px; left:22%; width:40%; height:14px; background:var(--lime); border:1px solid var(--ink); transform:rotate(-2deg)}
        .warning-tape{background:repeating-linear-gradient(45deg, var(--lime) 0 14px, var(--ink) 14px 28px); color:var(--ink); padding:4px 8px; font-family:'Anton'; font-size:10px; letter-spacing:.18em; border:2px solid var(--ink); display:inline-block; transform:rotate(-1deg); margin-bottom:8px}
        .stamp{border:2px solid var(--ink); padding:2px 8px; font-family:'Anton'; font-size:9px; letter-spacing:.12em; display:inline-block; transform:rotate(-3deg)}
        .stamp-live{background:var(--lime); color:var(--ink)}
        .stamp-admin{background:var(--orange); color:white; transform:rotate(3deg)}
        .status-dot{width:12px; height:12px; border-radius:50%; border:2px solid var(--ink); display:inline-block; vertical-align:middle; margin-right:6px}
        .status-dot.green{background:var(--lime); box-shadow:0 0 8px var(--lime)}
        .status-dot.red{background:var(--orange)}
        .status-dot.yellow{background:gold}
        .table-wrap{overflow:auto; border:var(--line) solid var(--ink); background:white}
        table{width:100%; border-collapse:collapse; font-size:11px}
        th{background:var(--ink); color:var(--paper); padding:8px; text-align:left; font-family:'Anton'; font-size:10px; letter-spacing:.08em; position:sticky; top:0}
        td{padding:6px 8px; border-bottom:1px solid var(--ink); border-right:1px solid #ddd; vertical-align:middle}
        tr:hover td{background:var(--paper-2)}
        .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%) rotate(-1deg); background:var(--ink); color:var(--lime); border:3px solid var(--ink); padding:8px 14px; font-family:'Anton'; font-size:12px; letter-spacing:.06em; z-index:150; box-shadow:6px 6px 0 var(--ink); max-width:90vw; text-align:center}
        @media(max-width:900px){

          .hero-left{border-right:0; border-bottom:var(--line) solid var(--ink)}

          .nav-links{display:none}
          .footer-grid{grid-template-columns:1fr}
          .filter-bar{top:0; position:relative; flex-direction:column; align-items:stretch}
          .filter-group{border-right:0; border-bottom:1px solid var(--ink); justify-content:space-between}

          .how{grid-template-columns:1fr}
          .how div{border-right:0; border-bottom:var(--line) solid var(--ink)}
          .admin-tabs{flex-wrap:nowrap}
        }

        }
